name: Build and publish Docker image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  IMAGE_NAME: ghcr.io/bi9bbl/fmo-ca-tool

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Require a public source repository
        if: github.event.repository.private
        run: |
          echo "::error::Container publication is disabled while the source repository is private."
          exit 1

      - name: Check out the exact public source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Generate OCI tags and source labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish audited multi-platform image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Publish explicit CPU architecture tags
        id: arch-tags
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail

          manifest_json="$(docker buildx imagetools inspect "${IMAGE_NAME}@${IMAGE_DIGEST}" --raw)"
          amd64_digest="$(jq -r '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest' <<< "${manifest_json}")"
          arm64_digest="$(jq -r '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64") | .digest' <<< "${manifest_json}")"

          if [[ ! "${amd64_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Unable to resolve the linux/amd64 image manifest."
            exit 1
          fi
          if [[ ! "${arm64_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Unable to resolve the linux/arm64 image manifest."
            exit 1
          fi

          primary_tag=""
          while IFS= read -r tag; do
            [[ -n "${tag}" ]] || continue
            [[ -n "${primary_tag}" ]] || primary_tag="${tag}"

            docker buildx imagetools create \
              --prefer-index=false \
              --tag "${tag}-amd64" \
              "${IMAGE_NAME}@${amd64_digest}"
            docker buildx imagetools create \
              --prefer-index=false \
              --tag "${tag}-arm64" \
              "${IMAGE_NAME}@${arm64_digest}"
          done <<< "${IMAGE_TAGS}"

          if [[ -z "${primary_tag}" ]]; then
            echo "::error::No OCI image tags were generated."
            exit 1
          fi

          echo "amd64=${primary_tag}-amd64" >> "$GITHUB_OUTPUT"
          echo "arm64=${primary_tag}-arm64" >> "$GITHUB_OUTPUT"
          echo "amd64_digest=${amd64_digest}" >> "$GITHUB_OUTPUT"
          echo "arm64_digest=${arm64_digest}" >> "$GITHUB_OUTPUT"

      - name: Verify explicit CPU architecture tags
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          AMD64_IMAGE: ${{ steps.arch-tags.outputs.amd64 }}
          ARM64_IMAGE: ${{ steps.arch-tags.outputs.arm64 }}
        run: |
          set -euo pipefail

          docker pull --platform linux/amd64 "${AMD64_IMAGE}"
          test "$(docker image inspect "${AMD64_IMAGE}" --format '{{.Os}}/{{.Architecture}}')" = "linux/amd64"
          docker run --rm --platform linux/amd64 --network none "${AMD64_IMAGE}" --version

          docker pull --platform linux/arm64 "${ARM64_IMAGE}"
          test "$(docker image inspect "${ARM64_IMAGE}" --format '{{.Os}}/{{.Architecture}}')" = "linux/arm64"
          docker run --rm --platform linux/arm64 --network none "${ARM64_IMAGE}" --version

      - name: Exercise the published image by immutable digest
        if: github.event_name != 'pull_request'
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/fmo-pki"
          docker pull "${IMAGE_NAME}@${IMAGE_DIGEST}"
          docker run --rm \
            --network none \
            --user "$(id -u):$(id -g)" \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --mount "type=bind,src=${RUNNER_TEMP}/fmo-pki,dst=/work/pki" \
            "${IMAGE_NAME}@${IMAGE_DIGEST}" \
            init-root \
            --name "GitHub Actions FMO Root CA" \
            --email "actions@example.com" \
            --sn 900000001 \
            --key-id "actions-smoke-test" \
            --crl "" --license "" \
            --valid-days 1 \
            --out /work/pki/root
          test -s "${RUNNER_TEMP}/fmo-pki/root/root.key.json"
          test -s "${RUNNER_TEMP}/fmo-pki/root/root.cert.json"

      - name: Publish signed GitHub build attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: false
          create-storage-record: true

      - name: Publish signed amd64 image attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.arch-tags.outputs.amd64_digest }}
          push-to-registry: false
          create-storage-record: true

      - name: Publish signed arm64 image attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.arch-tags.outputs.arm64_digest }}
          push-to-registry: false
          create-storage-record: true

      - name: Record immutable image digest
        if: github.event_name != 'pull_request'
        run: |
          echo "### Published image" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          echo "${IMAGE_NAME}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.arch-tags.outputs.amd64 }}" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.arch-tags.outputs.arm64 }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
