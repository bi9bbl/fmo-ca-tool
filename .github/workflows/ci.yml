name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore FmoCaTool.sln
      - run: dotnet build FmoCaTool.sln -c Release --no-restore
      - run: dotnet test FmoCaTool.sln -c Release --no-build

  docker-build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --tag fmo-ca-tool:ci .
      - run: docker run --rm --read-only --cap-drop ALL fmo-ca-tool:ci --help
      - name: Exercise containerized Root creation
        run: |
          mkdir -p "${RUNNER_TEMP}/fmo-pki"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --mount "type=bind,src=${RUNNER_TEMP}/fmo-pki,dst=/work/pki" \
            fmo-ca-tool:ci \
            init-root \
            --name "CI FMO Root CA" \
            --email "ci@example.com" \
            --sn 900000001 \
            --key-id "ci-root" \
            --crl "" --license "" \
            --valid-days 1 \
            --out /work/pki/root
          test -f "${RUNNER_TEMP}/fmo-pki/root/root.key.json"
          test -f "${RUNNER_TEMP}/fmo-pki/root/root.cert.json"
